# By: Christopher Gray  |  Version: 1.0.35  |  Updated: 8/17/2026
#
# Rewritten against SearXNG 2026.8.x. See NOTES at the bottom of this file for
# what changed and why the previous revision (0.0.28) threw ~100 engine errors.
#
# The secret_key below is a placeholder — install_searxng.sh replaces it with
# `openssl rand -hex 32` at install time.
#
#---------------------------------------------------------------------------------
# In OpenWebUI: Admin Settings -> Web Search ->
#   Enable Web Search: on
#   Engine: searxng
#   Searxng Query URL:
#     http://<host>:7042/search?q=<query>&format=json
#   The literal <query> placeholder must be there — OpenWebUI substitutes it.
#---------------------------------------------------------------------------------

# Start from the shipped defaults, then keep only the engines listed here.
# Every name below is verified to exist in SearXNG's default settings — an
# unknown name here is silently added as a *new* engine and then fails to load,
# which is what produced the previous error storm.
use_default_settings:
  engines:
    keep_only:
      # --- general / web -------------------------------------------------
      - duckduckgo
      - brave
      - startpage
      - bing
      - mojeek
      - qwant
      - google
      - wikipedia
      - mwmbl        # independent index, keyless — the workhorse now
      - braveapi     # official Brave Search API, needs a key; off by default
      # `wikidata` is deliberately absent. Its init() calls the SPARQL endpoint
      # at query.wikidata.org, which 403s this host. An init failure is not
      # recoverable the way a query failure is — the engine never registers, and
      # it re-throws a full traceback on every boot. `disabled: true` would not
      # help: init runs regardless. Removing it from keep_only is the only fix.

      # --- news ----------------------------------------------------------
      - google news
      - bing news
      - duckduckgo news
      - brave.news
      - startpage news
      - reuters
      - wikinews

      # --- IT / dev ------------------------------------------------------
      - github
      - stackoverflow
      - askubuntu
      - superuser
      - docker hub
      - mdn
      - hackernews
      - lobste.rs
      - pypi
      - npm
      - crates.io
      - pkg.go.dev
      - microsoft learn
      - arch linux wiki
      - gentoo
      - mankier

      # --- science / AI --------------------------------------------------
      - arxiv
      - pubmed
      - semantic scholar
      - google scholar
      - crossref
      - openalex
      - openairepublications
      - openairedatasets
      - huggingface
      - huggingface datasets
      - huggingface spaces
      - ollama

      # --- security ------------------------------------------------------
      - national vulnerability database

      # --- videos --------------------------------------------------------
      - youtube
      - dailymotion
      - vimeo
      - sepiasearch
      - peertube

      # --- weather -------------------------------------------------------
      - wttr.in
      - duckduckgo weather
      - openmeteo

      # --- social media --------------------------------------------------
      - lemmy posts
      - lemmy communities
      - lemmy comments
      - mastodon users
      - mastodon hashtags
      - tootfinder
      - boardreader

      # --- blogs ---------------------------------------------------------
      - wiby
      - searchmysite

      # --- forums / Q&A --------------------------------------------------
      # stackoverflow / askubuntu / superuser are listed under IT above and
      # also carry the `q&a` category, so they populate the forums tab too.
      - discuss.python

      # --- utility -------------------------------------------------------
      - currency

server:
  secret_key: "CHANGE_ME_AT_INSTALL_TIME"
  limiter: false
  image_proxy: true
  port: 8080
  bind_address: "0.0.0.0"

ui:
  static_use_hash: true
  default_locale: ""
  query_in_title: false
  infinite_scroll: false
  center_alignment: false

# NOTE: this is a TOP-LEVEL key, not a child of `ui:`. In the previous revision
# it was nested under `ui:` and was therefore ignored entirely.
# Only categories that actually have engines are listed — an empty tab renders
# but returns nothing.
categories_as_tabs:
  general:
  news:
  tech:
  finance:
  crypto:
  sports:
  social media:
  blogs:
  q&a:
  it:
  science:
  ai:
  security:
  videos:
  weather:

search:
  safe_search: 0
  autocomplete: "wikipedia"
  default_lang: "en"
  formats:
    - html
    - json

# `enabled_plugins:` (the old display-name list) is no longer read by SearXNG.
# Plugins are now keyed by their fully-qualified class path, and this block
# REPLACES the default plugin set rather than merging with it — so anything you
# want active has to be listed here.
plugins:
  searx.plugins.calculator.SXNGPlugin:
    active: true
  searx.plugins.hash_plugin.SXNGPlugin:
    active: true
  searx.plugins.self_info.SXNGPlugin:
    active: true
  searx.plugins.unit_converter.SXNGPlugin:
    active: true
  searx.plugins.tracker_url_remover.SXNGPlugin:
    active: true
  searx.plugins.hostnames.SXNGPlugin:
    active: true
  searx.plugins.time_zone.SXNGPlugin:
    active: true
  searx.plugins.ahmia_filter.SXNGPlugin:
    active: true
  searx.plugins.tor_check.SXNGPlugin:
    active: true
  searx.plugins.oa_doi_rewrite.SXNGPlugin:
    active: false
  searx.plugins.infinite_scroll.SXNGPlugin:
    active: false

# Overrides merged onto the kept defaults, matched by `name`. These only turn
# engines on and re-file them into the custom `ai` / `security` tabs; the engine
# definitions themselves stay upstream's, so they can't drift out of sync.
engines:
  # Google is OFF. It does not error — it returns an empty result set and
  # reports nothing at all (`!go <query>` -> results: 0, unresponsive: []),
  # which is worse than a visible failure because it looks like it works.
  # That silent-nothing behaviour is why upstream ships it `inactive: true`.
  # Kept registered (inactive: false) so it still appears in Preferences and
  # can be re-tested by flipping `disabled`, but never queried by default.
  - name: google
    inactive: false
    disabled: true

  # Bing is the one scraping-based general engine still answering reliably.
  - name: bing
    disabled: false

  # mwmbl — independent crawler/index, no API key, no bot challenge. Measured
  # on 2026-08-17 it returned more results than every other general engine
  # combined (36-42 per query vs 9-11 for bing). Different corpus to the big
  # engines, so treat it as added coverage rather than a Google replacement.
  - name: mwmbl
    disabled: false

  # braveapi — the OFFICIAL Brave Search API, as opposed to the `brave` engine
  # which scrapes search.brave.com and is now refused with HTTP 429 from every
  # IP tested. Authenticated API calls are not bot-challenged, so this is the
  # durable way to get Brave results back.
  #
  # Held with `inactive: true`, NOT `disabled: true`. braveapi.py raises
  # SearxEngineAPIException("No API key provided") from its init() when api_key
  # is empty, and init runs even for a disabled engine — so `disabled: true`
  # alone prints a full traceback on every single boot. `inactive: true` stops
  # the engine loading at all, which is silent. (Same trap as wikidata.)
  #
  # To enable:
  #   1. get a key at https://api.search.brave.com  (free tier ~2k queries/mo)
  #   2. set api_key below
  #   3. set inactive: false AND disabled: false
  #   4. docker compose restart searxng
  #
  # Do not commit a real key to the repo — this file is public. Either edit
  # /opt/searxng/settings.yml on the host after install, or keep the key in a
  # private overlay.
  - name: braveapi
    inactive: true
    disabled: true
    api_key: ""

  # -------------------------------------------------------------------------
  # Engines blocked from this host, switched off on 2026-08-17.
  #
  # These are NOT config errors — each engine loads and registers fine, then
  # gets refused at query time because the server's IP is treated as a bot:
  #
  #   duckduckgo  CAPTCHA (us-en)
  #   brave       Too many requests (HTTP 429, suspended 180s)
  #   startpage   redirected to /sp/captcha (suspended 3600s — the worst offender)
  #   qwant       CAPTCHA
  #   mojeek      HTTP 503 Service Not Available
  #
  # Left in keep_only rather than removed, so they still appear in Preferences
  # and can be re-enabled per-user, and so flipping them back is a one-line
  # change once the IP reputation clears. A disabled engine is never queried,
  # so it produces no log noise and costs no search latency.
  #
  # To re-test one: set disabled: false, `docker compose restart searxng`, then
  # watch http://<host>:7042/stats/errors for a few searches.
  # -------------------------------------------------------------------------
  - name: duckduckgo
    disabled: true
  - name: brave
    disabled: true
  - name: startpage
    disabled: true
  - name: qwant
    disabled: true
  - name: mojeek
    disabled: true

  # Same upstream hosts as the engines above, so they will be refused for the
  # same reason. Not individually observed failing only because the test query
  # was in the `general` category.
  - name: duckduckgo news
    disabled: true
  - name: brave.news
    disabled: true
  - name: startpage news
    disabled: true

  # Hacker News and Lobsters are the two genuine tech-news sources available:
  # SearXNG ships no TechCrunch/Ars/Verge engine, and those sites have no
  # keyless search API, so they are only reachable via general web search.
  - name: hackernews
    disabled: false
    categories: [it, news, tech]
  - name: lobste.rs
    disabled: false
    categories: [it, news, tech]
  - name: pypi
    disabled: false
  - name: npm
    disabled: false
  - name: crates.io
    disabled: false
  - name: pkg.go.dev
    disabled: false
  - name: microsoft learn
    disabled: false

  # scholar.google.com refuses the connection outright (httpx.ConnectError, not
  # a CAPTCHA) — same Google-blocking family as the `google` engine above.
  - name: google scholar
    disabled: true

  - name: crossref
    disabled: false
  - name: openalex
    disabled: false
    categories: [science, ai]
  - name: arxiv
    categories: [science, ai]
  - name: semantic scholar
    categories: [science, ai]

  - name: huggingface
    disabled: false
    categories: [ai, it]
  - name: huggingface datasets
    disabled: false
    categories: [ai, it]
  - name: huggingface spaces
    disabled: false
    categories: [ai, it]

  # Points at http://localhost:11434 by default, which inside the container is
  # the container itself. To use the host's Ollama, set:
  #   base_url: http://host.docker.internal:11434
  # (and add an extra_hosts entry in docker-compose.yml), then disabled: false.
  - name: ollama
    categories: [ai]

  - name: national vulnerability database
    disabled: false
    categories: [security, it]

  - name: peertube
    disabled: false
  - name: duckduckgo weather
    disabled: false
    categories: [weather]
  - name: openmeteo
    disabled: false
    categories: [weather]
  - name: wttr.in
    categories: [weather]

  # =========================================================================
  # FINANCE  (custom engines — SearXNG ships none)
  #
  # SearXNG has no finance engine of any kind: a full catalogue of the 272
  # active engines in the image contains zero finance/stock entries (the only
  # "stock" matches are stock *photography*). These are built on `json_engine`,
  # the generic JSON-API engine, against endpoints verified to answer without
  # an API key on 2026-08-17.
  #
  # READ THIS BEFORE USING FOR STOCK PREDICTION: these return *search results*
  # — links to tickers and articles. They do not return prices, OHLCV bars,
  # fundamentals or any numeric series, and SearXNG has no way to. Prediction
  # work needs a real market-data API (yfinance, Alpha Vantage, Finnhub,
  # Polygon) wired into the Ollama/OpenWebUI tool layer. Use these to *find*
  # tickers and news; use a data API to model them.
  # =========================================================================
  # Rate-limits hard by source IP: ~15 queries inside a few minutes earns a
  # sustained HTTP 429, while human-paced queries return 200. SearXNG then
  # suspends the engine for a cool-off period, so a burst costs you more than
  # the burst itself. Fine for interactive use; if you drive SearXNG from an
  # agent loop, expect this one to drop out and lean on coingecko + bing news.
  - name: yahoo finance
    engine: json_engine
    shortcut: yf
    categories: [finance]
    paging: false
    search_url: https://query2.finance.yahoo.com/v1/finance/search?q={query}&quotesCount=10&newsCount=0
    results_query: quotes
    url_query: symbol
    url_prefix: https://finance.yahoo.com/quote/
    title_query: shortname
    content_query: exchDisp
    about:
      website: https://finance.yahoo.com
      use_official_api: false
      require_api_key: false
      results: JSON

  # DISABLED ON PURPOSE — not because it is broken. It hits the exact same
  # endpoint as `yahoo finance` above, so leaving both on doubles the requests
  # to an endpoint that rate-limits hard by IP (measured 2026-08-17: rapid
  # back-to-back calls return HTTP 429, calls 10s apart all return 200).
  # Reach it on demand with the bang syntax instead:  !yfn tesla earnings
  - name: yahoo finance news
    engine: json_engine
    shortcut: yfn
    categories: [finance, news]
    disabled: true
    paging: false
    search_url: https://query2.finance.yahoo.com/v1/finance/search?q={query}&quotesCount=0&newsCount=15
    results_query: news
    url_query: link
    title_query: title
    content_query: publisher
    about:
      website: https://finance.yahoo.com
      require_api_key: false
      results: JSON

  - name: coingecko
    engine: json_engine
    shortcut: cg
    categories: [finance, crypto]
    paging: false
    search_url: https://api.coingecko.com/api/v3/search?query={query}
    results_query: coins
    url_query: id
    url_prefix: https://www.coingecko.com/en/coins/
    title_query: name
    content_query: symbol
    thumbnail_query: thumb
    about:
      website: https://www.coingecko.com
      require_api_key: false
      results: JSON

  - name: coinpaprika
    engine: json_engine
    shortcut: cp
    categories: [finance, crypto]
    paging: false
    search_url: https://api.coinpaprika.com/v1/search/?q={query}&c=currencies&limit=15
    results_query: currencies
    url_query: id
    url_prefix: https://coinpaprika.com/coin/
    title_query: name
    content_query: symbol
    about:
      website: https://coinpaprika.com
      require_api_key: false
      results: JSON

  # SEC EDGAR full-text filing search — the best free fundamentals source.
  #
  # Held `inactive: true`. The SEC requires every automated request to carry a
  # User-Agent identifying a real person and contact address, and blocks
  # traffic that does not. install_searxng.sh enables this engine only once
  # SEC_USER_AGENT in /opt/searxng/.env has been changed from the shipped
  # example — sending the example value would be worse than not running at all.
  #
  # Result URLs are per-COMPANY filing browsers, not per-filing: a filing URL
  # has to be assembled from cik + accession + filename, and json_engine can
  # only prefix a single field.
  - name: sec edgar
    engine: json_engine
    shortcut: sec
    categories: [finance]
    inactive: true
    disabled: true
    paging: false
    search_url: https://efts.sec.gov/LATEST/search-index?q={query}&forms=10-K,10-Q,8-K
    results_query: hits/hits
    url_query: _source/ciks/0
    url_prefix: https://www.sec.gov/edgar/browse/?CIK=
    title_query: _source/display_names/0
    content_query: _source/file_type
    headers:
      User-Agent: "Jane Doe jane.doe@example.com"
    about:
      website: https://www.sec.gov/edgar
      require_api_key: false
      results: JSON

  # =========================================================================
  # SPORTS  (custom engine — SearXNG ships none)
  #
  # TheSportsDB team lookup. Narrow by nature: it matches team names, not
  # arbitrary sports questions, so a general query returns nothing rather than
  # something irrelevant. Scores and fixtures need their v2 API and a key.
  # =========================================================================
  - name: thesportsdb
    engine: json_engine
    shortcut: tsdb
    categories: [sports]
    paging: false
    search_url: https://www.thesportsdb.com/api/v1/json/3/searchteams.php?t={query}
    results_query: teams
    url_query: idTeam
    url_prefix: https://www.thesportsdb.com/team/
    title_query: strTeam
    content_query: strDescriptionEN
    thumbnail_query: strBadge
    about:
      website: https://www.thesportsdb.com
      require_api_key: false
      results: JSON

  # =========================================================================
  # SOCIAL MEDIA / BLOGS / FORUMS — all shipped engines, just switched on
  # =========================================================================
  - name: lemmy posts
    disabled: false
  - name: lemmy communities
    disabled: false
  - name: lemmy comments
    disabled: false
  - name: mastodon users
    disabled: false
  - name: mastodon hashtags
    disabled: false
  - name: tootfinder
    disabled: false
  - name: boardreader
    disabled: false

  - name: wiby
    disabled: false
  # searchmysite returns "access denied" — same bot-blocking pattern as the big
  # engines. Left registered so it can be re-tested by flipping this line.
  - name: searchmysite
    disabled: true

  - name: discuss.python
    disabled: false

outgoing:
  request_timeout: 15.0
  max_request_timeout: 30.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true
  # Retry once through the next proxy in the pool before giving up. Harmless
  # without proxies configured (it just retries the same direct route).
  retries: 1

  # >>> MANAGED BLOCK: outbound proxy pool — do not edit by hand.
  # install_searxng.sh rewrites everything between these two markers from
  # SEARXNG_PROXIES in /opt/searxng/.env. Empty means direct egress.
  #
  # SearXNG round-robins a proxy list per request (searx/network/network.py
  # builds `cycle(proxy_urls)`), so listing several egress points spreads load
  # across them automatically — which is what makes the rate-limited engines
  # (yahoo finance, sec edgar) and the CAPTCHA-blocked ones survivable.
  #
  # If the host itself has several public IPs rather than proxies, use
  # `source_ips:` instead — it is cycled the same way:
  #   source_ips:
  #     - 203.0.113.10
  #     - 203.0.113.11
  # <<< MANAGED BLOCK: outbound proxy pool

# ===========================================================================
# NOTES — why revision 0.0.28 failed, and what is intentionally gone
# ===========================================================================
#
# 1. `engine: xml_feed` (~95 entries) — no such engine. `searx/engines/xml_feed.py`
#    has never existed in SearXNG's git history. SearXNG has NO generic RSS/Atom
#    feed engine at all, and `engine: xpath` is not a substitute: it calls
#    lxml's `html.fromstring(resp.text)` on a str, which raises ValueError on any
#    feed carrying an `<?xml ... encoding="UTF-8"?>` declaration (verified against
#    BBC, Ars Technica, Krebs, The Verge, Project Zero — 5 of 6 hard-fail).
#    All RSS-sourced entries — world news, tech, finance, AI, security, sports —
#    were therefore removed. Aggregate those feeds outside SearXNG (miniflux,
#    FreshRSS, or a fetcher feeding Ollama's tool layer) instead.
#
# 2. `engine: reddit` — existed until it was removed upstream on 2026-07-30, so
#    it is gone from any image newer than that. No replacement.
#
# 3. `engine: yahoo_finance`, `tradingview`, `phind` — never existed in SearXNG.
#
# 4. `name: espn` used `url:` where the xpath engine requires `search_url:` plus
#    `results_xpath` / `url_xpath` / `title_xpath` / `content_xpath`. Removed.
#
# 5. FINANCE + SPORTS (added 2026-08-17). SearXNG ships no engine for either —
#    a full catalogue of the 272 active engines in the image returns zero
#    finance and zero sports entries. They are built here on `json_engine`,
#    the generic JSON-API engine, against endpoints verified keyless:
#      yahoo finance  quotes    query2.finance.yahoo.com/v1/finance/search
#      yahoo finance  news      (same endpoint; disabled to halve request rate)
#      coingecko                api.coingecko.com/api/v3/search
#      thesportsdb              thesportsdb.com/api/v1/json/3/searchteams.php
#
#    These return LINKS, not numbers. For actual price/fundamental data to
#    model against, use these keyless sources from the Ollama/OpenWebUI tool
#    layer — none of them fit SearXNG's result shape, which is why they are
#    documented here rather than configured as engines:
#
#      Yahoo chart (OHLCV)  https://query1.finance.yahoo.com/v8/finance/chart/NVDA?range=1y&interval=1d
#      yfinance (python)    wraps the above; the pragmatic default
#      SEC EDGAR full text  https://efts.sec.gov/LATEST/search-index?q=%22nvidia%22&forms=10-K
#      SEC company facts    https://data.sec.gov/api/xbrl/companyfacts/CIK0001045810.json
#      SEC submissions      https://data.sec.gov/submissions/CIK0001045810.json
#      Frankfurter (FX)     https://api.frankfurter.app/latest?from=USD
#      CoinGecko markets    https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd
#
#    SEC EDGAR is the highest-value one for fundamentals and it is genuinely
#    free, but it needs a descriptive User-Agent header and its filing URLs
#    must be composed from several JSON fields, which json_engine cannot do.
#    All SEC endpoints require: User-Agent: "Your Name your@email".
#
# 6. Blocked-by-IP engines (2026-08-17): duckduckgo, brave, startpage, qwant and
#    mojeek all refuse this host with CAPTCHAs / 429 / 503, and wikidata 403s
#    during init. They are disabled above (wikidata removed outright). General
#    web search now rests on google + bing + wikipedia, which were the only
#    general engines NOT erroring in the logs. If those two start CAPTCHAing as
#    well, the practical options are an outbound proxy/VPN with a residential
#    IP, or leaning on the API-based engines (arxiv, github, stackoverflow,
#    pubmed, hackernews, nvd), which authenticate normally and never CAPTCHA.
#
# 7. Harmless log lines you will still see and can ignore:
#      - "ahmia / torch: can't register engine" — both are `categories: onions`
#        in the shipped defaults and are skipped whenever no Tor proxy is
#        configured. Add them to `use_default_settings.engines.remove` to silence.
#      - "TRACKER_PATTERNS: HTTPError (rules1.clearurls.xyz)" — startup fetch of
#        the tracker-stripping rule set; retried later.
#      - "X-Forwarded-For nor X-Real-IP header is set!" — cosmetic, and logged
#        exactly once per worker. searx/botdetection/trusted_proxies.py emits it
#        unconditionally when neither header is present; it is NOT gated on the
#        trusted_proxies setting, so limiter.toml cannot silence it. The only
#        way to make it stop is to put a reverse proxy in front that sets the
#        header. Ignore it while the container is published directly.
